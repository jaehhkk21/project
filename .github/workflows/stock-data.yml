name: Refresh stock universe and deploy Pages
on:
  push:
    branches: [main]
    paths: ['stocks/**', '.github/workflows/stock-data.yml']
  schedule:
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stock-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified-registry dependencies
        run: python -m pip install yfinance==0.2.66
      - name: Test collection and recommendation rules
        run: |
          python -m unittest discover -s stocks/scripts -p 'test_*.py'
          node --test stocks/ranking.test.js
      - name: Collect full provider universe (no sample fallback)
        run: python stocks/scripts/collect.py
      - name: Prepare only public site files
        run: |
          mkdir -p _site/stocks/data
          cp index.html style.css app.js lottery.js _site/
          cp stocks/index.html stocks/style.css stocks/app.js stocks/ranking.js _site/stocks/
          cp stocks/data/market.json _site/stocks/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published real-data recommendations
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYVERIFY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          base = os.environ['PAGE_URL'].rstrip('/') + '/stocks/'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base + 'data/market.json?t=' + str(time.time()), timeout=30) as response:
                      data = json.load(response)
                  assert data['status'] == 'ready' and len(data['stocks']) > 4000
                  assert data['quality']['KR']['eligible'] > 0 and data['quality']['US']['eligible'] > 0
                  assert (datetime.now(timezone.utc) - datetime.fromisoformat(data['collectedAt'])).total_seconds() < 3600
                  for path, marker in [('index.html', 'id="recommend"'), ('app.js?v=3', 'validateSnapshot')]:
                      with urllib.request.urlopen(base + path, timeout=30) as response:
                          assert marker in response.read().decode()
                  print('Published site verified:', len(data['stocks']), 'real stocks', data['quality'])
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                      out.write('\nPublished HTML, recommendation code, and fresh real-data JSON verified by HTTP requests.\n')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PYVERIFY
