name: Inspect published stock data fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public provider fields without credentials
        run: |
          python - <<'PY'
          import urllib.request, json, os, time
          url = 'https://jaehhkk21.github.io/project/stocks/data/market.json?t=' + str(time.time())
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Public data field diagnosis\n\n')
              out.write('Collected at: ' + str(data.get('collectedAt')) + '\n\n')
              for market in ['KR', 'US']:
                  rows = [s for s in data['stocks'] if s['market'] == market]
                  presence = {k: sum(s.get(k) is not None for s in rows) for k in ['price','pe','low52','high52','volume','priceTime']}
                  out.write('### ' + market + '\n\n```json\n' + json.dumps({'count':len(rows),'presence':presence,'examples':rows[:2]},ensure_ascii=False) + '\n```\n')
          PY
