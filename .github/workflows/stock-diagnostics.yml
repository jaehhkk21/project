name: Inspect provider stock data fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yfinance==0.2.66
      - name: Inspect public provider fields without credentials
        run: |
          python - <<'PY'
          import json, yfinance as yf
          for region, exchange in [('kr','KSC'),('us','NMS')]:
              q = yf.EquityQuery('and',[yf.EquityQuery('eq',['region',region]),yf.EquityQuery('eq',['exchange',exchange])])
              data = yf.screen(q,size=2,sortField='intradaymarketcap',sortAsc=False)
              for row in data['quotes'][:1]:
                  print('::notice title=Provider fields::'+json.dumps({'market':region,'row':row},ensure_ascii=True))
          PY
